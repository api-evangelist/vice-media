x-enrichment-notes: >-
  Deliberately absent, each a verified negative probed on 2026-09-04. WellKnown and SecurityTxt: every
  named /.well-known path plus /apis.json and /apis.yml returned 404 on www.vice.com, video.vice.com and
  www.vicemedia.com and 403 on api.vice.com, with a negative-control path returning the same, so the
  probe is recorded in well-known/vice-media-well-known.yml with NO pointer. AgentCard:
  /.well-known/agent-card.json and /.well-known/agent.json 404 on every host, so nothing was written.
  MCPServer: no server exists on any host and no mcp namespace is declared, so the derived tool list
  carries the X-MCPServerCandidate pointer, never MCPServer. SDKs and a first-party CLI: nothing on npm,
  PyPI or any other registry, and the 56-repo VICEMedia GitHub org publishes no client library.
  StatusPage: status.vice.com is NXDOMAIN and no uptime page exists anywhere. Deprecation: no policy and
  no RFC 8594 Sunset or Deprecation header on any observed response. Idempotency: no replay-protection
  contract exists on this surface, so no Idempotency pointer is emitted. TrustCenter and Compliance: no
  certification, attestation or trust page is published. AsyncAPI and Webhooks: no event or webhook
  surface. Postman, Roadmap, Sandbox, Changelog, CLI, Components, DeclineCodes, OAuthScopes, Protobuf and
  WSDL: none published. DeveloperPortal, Documentation, APIReference, GettingStarted and Support: Vice
  Media runs no developer programme at all, so none of these pages exists to point at. The Security
  pointer is the company's published responsible-disclosure policy at
  https://www.vice.com/en/vice-responsible-disclosure-policy/ (HTTP 200), which is linked from the site
  footer but is NOT served at /.well-known/security.txt - the single cheapest fix available to this
  provider. The Pricing and SignUp pointers are reader membership tiers, not API access. ContentSignal: well-known/vice-media-robots.txt is saved as evidence but carries NO pointer - the file declares 'User-agent: * / Disallow:' with no Content Signals policy and no AI-crawler rule, so asserting a consent signal the provider does not publish would over-credit it.
