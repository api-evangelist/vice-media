x-operator: >-
  The vice.com and video.vice.com WordPress surfaces are served by VICE Digital Publishing, LLC, which the
  site's own About page (https://www.vice.com/en/about-vice-digital-publishing/, HTTP 200, fetched
  2026-09-04) describes as "a Savage Ventures company" at 1402 3rd Ave N, Nashville TN. They are recorded
  under Vice Media because vice.com is the VICE brand's own domain and the entity is the Vice
  Digital Publishing joint venture Vice Media formed with Savage Ventures in 2024, in which Vice Media
  retained brand control. Content licensing and pitches route to savage.ventures addresses; press
  (press@vice.com), advertising (sales@vice.com) and security (infosec@vice.com) remain on vice.com.
