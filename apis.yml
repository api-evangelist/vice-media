apis:
- aid: vice-media:vice-media-wordpress-rest-api
  name: VICE WordPress REST API
  description: >-
    The live WordPress REST API served by vice.com. 601 routes are declared by the route-discovery
    document at https://www.vice.com/wp-json/, which the site advertises in the head of every page as
    <link rel="https://api.w.org/">. The core content namespaces read anonymously — posts (822,047 of
    them per the X-WP-Total header), pages, media, search, the vice_section / profile / sp_product custom
    post types, and the category, tag, byline, brand and platform-language taxonomies. Users, settings,
    block types and every editorial plugin namespace return HTTP 401.
  humanURL: https://www.vice.com/wp-json/
  baseURL: https://www.vice.com/wp-json
  tags:
  - Content
  - Publishing
  - WordPress
  - oEmbed
  properties:
  - type: OpenAPI
    url: openapi/_ae-authored/vice-media-wp-rest-openapi.yml
  - type: DataModel
    url: data-model/vice-media-data-model.yml
  - type: ErrorCatalog
    url: errors/vice-media-problem-types.yml
  - type: Conventions
    url: conventions/vice-media-conventions.yml
- aid: vice-media:vice-media-video-wordpress-rest-api
  name: VICE Video WordPress REST API
  description: >-
    A second WordPress install answering on video.vice.com with 586 declared routes and the same core
    content namespaces, advertised the same way in the page head. Its public archive is effectively
    empty — the posts collection returns X-WP-Total 1 — so the surface is a live contract with almost no
    content behind it.
  humanURL: https://video.vice.com/wp-json/
  baseURL: https://video.vice.com/wp-json
  tags:
  - Content
  - Video
  - WordPress
  properties:
  - type: OpenAPI
    url: openapi/_ae-authored/vice-media-video-wp-rest-openapi.yml
  - type: Overlay
    url: overlays/vice-media-video-wp-rest-overlay.yaml
- aid: vice-media:vice-media-platform-api
  name: VICE Platform API
  description: >-
    An authenticated platform gateway on api.vice.com, running nginx in front of an Express service that
    identifies itself as "api-auth 1.13.2" in the x-app-version response header. Every path probed
    anonymously on 2026-09-04, including a control path that cannot exist, returned an identical HTTP 401
    {"message":"No client found attached to request","code":"invalid_req_client","status":401}, so no
    contract, path list or documentation is observable without a client credential. Its
    content-security-policy names the legacy VICE international properties (viceland.com, viceland.nl,
    vicesports.nl, vicemoney.nl, vicebelgique.com) as permitted frame ancestors.
  humanURL: https://api.vice.com/
  baseURL: https://api.vice.com
  tags:
  - Platform
  - Gated
  properties:
  - type: Authentication
    url: authentication/vice-media-authentication.yml
