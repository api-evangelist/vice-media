aid: vice-media
name: Vice Media
description: >-
  Vice Media is the Brooklyn, New York youth-culture and news media company founded in 1994 in Montreal
  by Suroosh Alvi, Shane Smith and Gavin McInnes, which grew from the VICE magazine into a global
  multi-platform publisher, film and television studio and creative agency before filing for Chapter 11
  in May 2023 and being acquired for $350 million by a consortium led by Fortress Investment Group. It
  operates today through Vice Studios Group, Vice TV, the Virtue creative agency and Vice Digital. Vice
  Media runs no developer programme, publishes no API documentation, portal, SDK or pricing, and sells no
  API product. It is catalogued here because its flagship editorial property, vice.com — owned and
  operated under the VICE brand by VICE Digital Publishing, LLC, the Savage Ventures joint venture Vice
  Media announced in 2024 — serves a live, anonymously readable WordPress REST API of 601 routes that the
  site advertises in the head of every page, exposing an editorial archive of 822,047 posts across 20
  language editions, plus an oEmbed 1.0 provider endpoint and RSS 2.0 syndication. A second WordPress
  install answers on video.vice.com, and a separate authenticated platform gateway on api.vice.com
  answers every anonymous request with HTTP 401.
